<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dae3df" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#172025" media="(prefers-color-scheme: dark)">
  <title>World Timeline</title>
  <meta name="description" content="An interactive map of human history: borders, wars and major events, scrubbed through time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>
  <div id="notes"></div>
  <div id="hover"></div>
  <a id="contribute" href="https://github.com/wi11s/timeline" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></svg>
    contribute
  </a>
  <article id="card" hidden>
    <img alt="" hidden>
    <button id="close" aria-label="close">×</button>
    <div class="body">
      <p class="meta"></p>
      <h2></h2>
      <p class="desc"></p>
      <a class="wiki" target="_blank" rel="noopener">read on wikipedia ↗</a>
    </div>
  </article>
  <footer>
    <div id="controls">
      <button id="play" aria-label="play" aria-pressed="false" title="play (space)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M4.5 2.5v11l9-5.5z"/><path class="i-pause" d="M4 2.5h3v11H4zm5 0h3v11H9z"/></svg>
      </button>
      <button id="speed" aria-label="playback speed" title="playback speed">1×</button>
    </div>
    <output id="year"></output>
    <div id="track" role="slider" tabindex="0" aria-label="year">
      <div id="ticks"></div>
      <div id="handle"></div>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
